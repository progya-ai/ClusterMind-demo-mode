# Render Blueprint: deploys the public demo of ClusterMind (no AI model needed).
services:
  - type: web
    name: clustermind-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-demo.txt
    startCommand: python -m cmapp web --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: CM_DEMO
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.10
